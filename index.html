<!doctype html>
<html lang="javascript">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Stop Watch</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Stop Watch</h1>
            <div class="clock-container">
                <div id="time">00:00:00:00</div>
                <div class="btns">
                    <button onclick="start()" class="btn" id="startBtn">Start</button>
                    <button onclick="stop()" class="btn" id="StopBtn">Stop</button>
                    <button onclick="reset()" class="btn" id="resetBtn">Reset</button>
                </div>
            </div>
        </div>
        <script src="/index.js"></script>
    </body>
</html>
